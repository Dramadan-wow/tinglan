name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 -DIM_BUILD_GUI=ON -DIM_BUILD_SERVER=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DIM_DESKTOP_OUTPUT="$env:GITHUB_WORKSPACE/build-ci/app"
      - name: Build
        run: cmake --build build-ci --config Release --parallel 4 -- /nodeReuse:false
      - name: Core and admin tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

  ubuntu-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure independent server
        run: cmake -S server -B build-ci-server -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build independent server
        run: cmake --build build-ci-server --parallel 4
      - name: Server starts
        run: ./build-ci-server/im_server --help
